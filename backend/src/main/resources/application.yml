spring:
  application:
    name: portal-escolar
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal_escolar}
    username: ${DB_USERNAME:portal_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: portal
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    schemas: portal
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bogota
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-0123456789abcdef0123456789abcdef}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-name: ${JWT_COOKIE_NAME:portal_refresh}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    dir: ${APP_UPLOAD_DIR:./uploads}
    max-bytes: 10485760
  institution:
    default-name: ${INSTITUTION_NAME:Portal Escolar}
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
    password: ${APP_DEMO_PASSWORD:Portal2026*}
