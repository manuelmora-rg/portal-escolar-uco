<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Feria de Ciencia y Tecnología">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532D"/>
      <stop offset="1" stop-color="#0B2E1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#DCFCE7" stroke-width="2">
    <circle cx="980" cy="180" r="60" fill="none"/>
    <ellipse cx="980" cy="180" rx="150" ry="55" fill="none" transform="rotate(-25 980 180)"/>
    <ellipse cx="980" cy="180" rx="150" ry="55" fill="none" transform="rotate(65 980 180)"/>
    <circle cx="980" cy="180" r="16" fill="#DCFCE7"/>
    <circle cx="150" cy="600" r="40" fill="none"/>
    <circle cx="230" cy="650" r="22" fill="none"/>
    <path d="M80 120 h120 v90 h-120 z" fill="none"/>
    <path d="M40 540 l60 -90 l60 90 z" fill="none"/>
  </g>
  <text x="120" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#86EFAC" letter-spacing="3">CIENCIA E INNOVACIÓN</text>
  <text x="120" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Feria de Ciencia</text>
  <text x="120" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">y Tecnología</text>
  <text x="120" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#DCFCE7">Proyectos, experimentos y talento estudiantil</text>
  <rect x="120" y="570" width="140" height="8" rx="4" fill="url(#accent)"/>
